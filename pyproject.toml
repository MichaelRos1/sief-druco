[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sief-druco"
version = "0.1.0"
description = "Polypharmacy side-effect prediction on Decagon, weighted by co-prescription"
requires-python = ">=3.13"
dependencies = [
    # The versions tested on MPS in #3.
    "torch==2.15.0",
    "torch_geometric==2.8.1",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",  # reliability diagrams of the calibration report (#38)
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]  # sklearn: reference values in the metric tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test helpers, e.g. tiny_score_table
